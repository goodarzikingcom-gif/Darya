<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darya's Music</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Pacifico&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f3ecff; --dim: #b3a5dd; --gold1: #fff1b8; --gold2: #e8b94a; --gold3: #b9812a; --vio: #8b5cf6; --pink: #ff7aa8;
    --line: rgba(245, 213, 138, .24); --glassbg: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.025)); --g: .25; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #0b0620; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #0b0620 0%, #150a3d 55%, #1f0f55 100%) fixed; color: var(--ink);
    font-family: 'Poppins', system-ui, sans-serif; padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(48px + env(safe-area-inset-bottom, 0px));
  }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; animation: drift 22s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width: 70vmax; height: 70vmax; left: -28vmax; top: -26vmax; background: #4f2bd6; opacity: .55; }
  .bg i:nth-child(2) { width: 56vmax; height: 56vmax; right: -24vmax; top: 18vmax; background: #9b3fd0; opacity: .38; animation-delay: -8s; }
  .bg i:nth-child(3) { width: 46vmax; height: 46vmax; left: 6vmax; bottom: -26vmax; background: #d49a2f; opacity: .22; animation-delay: -14s; }
  .bg::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(1.2px 1.2px at 30px 40px, #fff 50%, transparent 52%), radial-gradient(1px 1px at 120px 90px, #ffe9a8 50%, transparent 52%),
      radial-gradient(1px 1px at 200px 160px, #fff 50%, transparent 52%), radial-gradient(1.4px 1.4px at 80px 190px, #d9c8ff 50%, transparent 52%); background-size: 240px 240px; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--g);
    background: radial-gradient(circle at 50% 18%, rgba(190, 140, 255, .55), rgba(232, 185, 74, .18) 38%, transparent 62%); }
  @keyframes drift { to { transform: translate3d(5vmax, 4vmax, 0) scale(1.08); } }
  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px; }
  .brand small { display: block; letter-spacing: .28em; text-transform: uppercase; font-size: .62rem; color: var(--gold2); margin-bottom: 2px; }
  h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 2.1rem; line-height: 1.15; margin: 0;
    background: linear-gradient(135deg, var(--gold1), var(--gold2) 55%, #ffd8a8); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 14px rgba(232,185,74,.35)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .sbtn:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
  .pill { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-weight: 500; font-size: .9rem; }
  .pill.on { background: linear-gradient(135deg, #8b5cf6, #5b3df5); border-color: rgba(245,213,138,.6); }
  .pill.gold { background: linear-gradient(135deg, var(--gold1), var(--gold2) 60%, #c48a2c); color: #2a1700; border-color: transparent; font-weight: 600; }

  /* Player */
  .player { background: var(--glassbg); border: 1px solid var(--line); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 24px 70px rgba(14, 4, 50, .65), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .now { display: flex; align-items: center; gap: 14px; }
  .vinyl { width: 78px; height: 78px; border-radius: 50%; flex: none; position: relative; display: grid; place-items: center;
    background: conic-gradient(from 20deg, #15102a, #2a2250, #15102a 25%, #2a2250 50%, #15102a 75%, #2a2250), #15102a;
    box-shadow: 0 8px 26px rgba(0,0,0,.55), 0 0 0 2px rgba(245,213,138,.35); animation: spin 5.5s linear infinite; animation-play-state: paused; }
  .vinyl::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(255,255,255,.06) 0 1px, transparent 1px 4px); }
  .vinyl span { width: 30px; height: 30px; border-radius: 50%; position: relative; z-index: 1; box-shadow: 0 0 0 3px rgba(0,0,0,.35);
    background: radial-gradient(circle at 50% 50%, #0b0620 0 12%, transparent 13%), linear-gradient(135deg, hsl(var(--h1, 270) 80% 62%), hsl(var(--h2, 40) 85% 58%)); }
  .vinyl.spin { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .meta b { font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta i { font-style: normal; color: var(--dim); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lcd { padding: 3px; border-radius: 17px; background: linear-gradient(145deg, var(--gold1), var(--gold3) 50%, var(--gold2)); box-shadow: 0 10px 34px rgba(91, 61, 245, .35); }
  .lcd .in { background: #07040f; border-radius: 14px; padding: 9px; }
  .glass { border-radius: 9px; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #5a6cff 0%, #3d3de6 100%); box-shadow: inset 0 0 30px rgba(10, 0, 90, .6); }
  .glass::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.16), transparent 42%); pointer-events: none; }
  .row { min-height: var(--ch, 36px); }
  .cells { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
  .cells span { display: block; text-align: center; height: var(--ch, 36px); line-height: var(--ch, 36px); border-radius: 2px; background: rgba(10, 0, 110, .28);
    font-family: 'VT323', ui-monospace, monospace; font-size: var(--fs, 34px); color: #f4f1ff; text-shadow: 0 0 6px rgba(215, 205, 255, .95); overflow: hidden; }
  .cells span.cur { background: rgba(240, 236, 255, .85); color: transparent; text-shadow: none; }
  .plain { display: none; height: var(--ch, 36px); line-height: var(--ch, 36px); text-align: center; font-family: 'Poppins', system-ui, sans-serif; font-weight: 500;
    font-size: calc(var(--ch, 36px) * .5); color: #f4f1ff; text-shadow: 0 0 8px rgba(215, 205, 255, .9); white-space: nowrap; overflow: hidden; background: rgba(10, 0, 110, .28); border-radius: 2px; }
  .row.isplain .cells { display: none; } .row.isplain .plain { display: block; }
  #leds { width: 100%; height: auto; display: block; }
  .prog { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 5px; background: rgba(255,255,255,.16); flex: 1; min-width: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: linear-gradient(135deg, var(--gold1), var(--gold2)); border: 0; box-shadow: 0 0 10px rgba(232,185,74,.7); }
  input[type=range]::-moz-range-thumb { width: 17px; height: 17px; border-radius: 50%; background: var(--gold2); border: 0; }
  .ctrl { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .ic { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); display: grid; place-items: center; position: relative; transition: transform .15s; }
  .ic:active { transform: scale(.92); }
  .ic svg { width: 22px; height: 22px; fill: currentColor; }
  .ic.big { width: 64px; height: 64px; background: linear-gradient(135deg, var(--gold1), var(--gold2) 60%, #c48a2c); border-color: transparent; color: #2a1700; box-shadow: 0 8px 28px rgba(232,185,74,.45); } .ic.big svg { width: 28px; height: 28px; }
  .ic.tog.on { color: var(--gold1); border-color: var(--gold2); box-shadow: 0 0 14px rgba(232,185,74,.35); }
  .ic[data-rep="one"]::after { content: "1"; position: absolute; font-size: .6rem; font-weight: 700; right: 9px; bottom: 8px; }
  .vol { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: .8rem; }
  .vol input { max-width: 150px; }

  /* Library */
  .tabs { display: flex; gap: 4px; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .tabs .pill { flex: 1; border: 0; background: none; padding: 9px 6px; font-size: .88rem; }
  .tabs .pill.on { background: linear-gradient(135deg, var(--gold1), var(--gold2) 60%, #c48a2c); color: #2a1700; font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .pill { white-space: nowrap; font-size: .82rem; padding: 6px 15px; }
  .search { width: 100%; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .search::placeholder { color: var(--dim); }
  .listhead { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 0; }
  .count { color: var(--dim); font-size: .85rem; margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .song { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07); border-radius: 18px; padding: 6px 10px 6px 6px; transition: background .2s, border-color .2s; }
  .song:hover { background: rgba(255,255,255,.08); }
  .song.playing { border-color: var(--gold2); background: linear-gradient(135deg, rgba(139,92,246,.28), rgba(232,185,74,.12)); box-shadow: 0 0 22px rgba(139,92,246,.25); }
  .sbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; padding: 4px; border-radius: 12px; }
  .cov { width: 48px; height: 48px; border-radius: 13px; flex: none; position: relative; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(135deg, hsl(var(--h1) 75% 58%), hsl(var(--h2) 70% 36%)); box-shadow: 0 5px 16px rgba(0,0,0,.4); }
  .cov::before { content: "♪"; color: rgba(255,255,255,.92); font-size: 1.3rem; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .cov::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 25% 18%, rgba(255,255,255,.38), transparent 55%); }
  .eq { position: absolute; inset: 0; z-index: 2; display: none; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 12px; background: rgba(8, 3, 30, .55); }
  .eq i { width: 4px; height: 16px; border-radius: 2px; background: var(--gold1); transform-origin: bottom; animation: bar .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes bar { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .song.playing .eq { display: flex; } .song.playing .cov::before { opacity: 0; } body:not(.live) .eq i { animation-play-state: paused; }
  .t { display: flex; flex-direction: column; min-width: 0; }
  .t b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t i { font-style: normal; color: var(--dim); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: .68rem; color: var(--gold1); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; background: rgba(232,185,74,.08); }
  .heart { background: none; border: 0; color: rgba(255,255,255,.22); font-size: 1.2rem; padding: 6px; line-height: 1; }
  .heart.on { color: var(--pink); text-shadow: 0 0 12px rgba(255,122,168,.7); } span.heart { cursor: default; }
  .more { background: none; border: 0; color: var(--dim); font-size: 1.3rem; padding: 6px 8px; line-height: 1; }
  .empty { text-align: center; color: var(--dim); padding: 34px 10px; }

  /* Admin and dialogs */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: linear-gradient(135deg, rgba(139,92,246,.16), rgba(232,185,74,.1)); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
  .bar[hidden] { display: none; }
  .bar .note { flex-basis: 100%; font-size: .78rem; color: var(--dim); margin: 0; }
  dialog { border: 1px solid var(--line); border-radius: 22px; padding: 0; background: linear-gradient(160deg, #1d1060, #0e0833); color: var(--ink); width: min(92vw, 470px); max-height: 86vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  dialog::backdrop { background: rgba(5, 2, 20, .75); backdrop-filter: blur(4px); }
  .card { padding: 20px; display: flex; flex-direction: column; gap: 11px; }
  .card h2 { margin: 0 0 2px; font-family: 'Pacifico', cursive; font-weight: 400; font-size: 1.4rem; color: var(--gold1); }
  .card label { font-size: .82rem; color: var(--dim); display: flex; flex-direction: column; gap: 5px; }
  .card input[type=text], .card input[type=password], .card select, .card textarea { padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.07); }
  .card textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: .8rem; }
  .card select option { color: #000; }
  .card .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .card p { margin: 0; font-size: .84rem; color: var(--dim); line-height: 1.5; }
  .card .err { color: #ff9aa8; min-height: 1.2em; }
  .line { display: flex; align-items: center; gap: 8px; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.1); padding: 6px 0; }
  .line input[type=text] { flex: 1; min-width: 0; }
  .danger { border-color: #ff6a7d; color: #ff9aa8; }
  @media (max-width: 400px) { .ctrl { gap: 9px; } .ic { width: 42px; height: 42px; } h1 { font-size: 1.85rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; animation: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header>
    <div class="brand"><small>Her favorites</small><h1>Darya's Music</h1></div>
    <button class="pill gold" id="adminBtn">Admin</button>
  </header>

  <section class="player" aria-label="Player">
    <div class="now">
      <div class="vinyl" id="vinyl"><span></span></div>
      <div class="meta"><b id="mt" dir="auto">Pick a song</b><i id="ma" dir="auto">Tap any song below</i></div>
    </div>
    <div class="lcd"><div class="in"><div class="glass" id="glass"><div class="row" id="r0"></div><div class="row" id="r1"></div></div></div></div>
    <canvas id="leds" width="640" height="96" aria-hidden="true"></canvas>
    <div class="prog"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button class="ic tog" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5l-1.8-1.8-4.2 4.2-1.4-1.4 4.2-4.2zM3 6h4.2l9.4 11.5H21v2h-5.4L6.2 8H3zm0 11h3.6l2.2-2.6 1.3 1.6L7.2 19H3zm13.5-6.5 1.4-1.4L21 12.2V17l-1.8-1.8z"/></svg></button>
      <button class="ic" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ic big" id="pp" aria-label="Play"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ic" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="ic tog" id="rep" aria-label="Repeat" data-rep="off"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    </div>
    <div class="vol"><span>Volume</span><input type="range" id="vol" min="0" max="100" value="85" aria-label="Volume"></div>
  </section>

  <div class="bar" id="adminBar" hidden>
    <button class="pill gold" id="aAdd">+ Add songs</button>
    <button class="pill" id="aCats">Categories</button>
    <button class="pill" id="aLists">Playlists</button>
    <button class="pill" id="aExport">Export</button>
    <button class="pill" id="aImport">Import</button>
    <button class="pill" id="aOut">Log out</button>
    <p class="note" id="aNote"></p>
  </div>

  <div class="tabs" id="tabs">
    <button class="pill on" data-mode="all">All songs</button>
    <button class="pill" data-mode="fav">♥ Favorites</button>
    <button class="pill" data-mode="list">Playlists</button>
  </div>
  <div class="chips" id="chips"></div>
  <input class="search" id="q" type="search" placeholder="Search songs" aria-label="Search songs">
  <div class="listhead"><p class="count" id="count"></p><button class="pill gold" id="playAll">▶ Play all</button></div>
  <ul id="list"></ul>
</main>

<dialog id="dlg"></dialog>
<audio id="a" preload="metadata"></audio>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => 's' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const hash = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };

  // ---------- Admin lock: only a salted hash of the code lives in this file, never the code itself ----------
  const ADMIN_LOCK = '8114818533987589';
  const cyrb53 = (str, seed = 0) => {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  };
  const lockOf = pin => { let x = 'darya-salt-v1:' + pin; for (let i = 0; i < 3000; i++) x = String(cyrb53(x, i)); return x; };

  // ---------- Data ----------
  const KEY = 'darya-music-draft-v1';
  const DEFAULT_CATS = ['Chill', 'Happy', 'Romantic', 'Sad', 'Dance'];
  let db = { songs: [], cats: DEFAULT_CATS.slice(), lists: [], favs: [] };
  let admin = sessionStorage.getItem('dm-admin') === '1', draft = false;
  const view = { mode: 'all', cat: '', list: '', q: '' };
  const localUrls = {};                                            // songs picked from this device that are not on the site yet
  const byId = id => db.songs.find(s => s.id === id);
  const norm = o => ({
    songs: (o.songs || []).map(s => ({ id: s.id || uid(), title: s.title || 'Untitled', artist: s.artist || '', file: s.file || '', cat: s.cat || '', lrc: s.lrc || '' })),
    cats: Array.isArray(o.cats) ? o.cats.slice() : DEFAULT_CATS.slice(),
    lists: (o.lists || []).map(l => ({ id: l.id || uid(), name: l.name || 'Playlist', ids: Array.isArray(l.ids) ? l.ids : [] })),
    favs: Array.isArray(o.favs) ? o.favs : []
  });
  function saveDraft() { try { localStorage.setItem(KEY, JSON.stringify(db)); draft = true; } catch (e) { /* storage can be unavailable */ } renderAll(); }

  async function load() {
    let base = null, local = null;
    try { const r = await fetch('songs.json', { cache: 'no-store' }); if (r.ok) base = await r.json(); } catch (e) { /* no songs.json yet */ }
    try { local = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* ignore */ }
    if (local && local.songs) { db = norm(local); draft = true; } else if (base) db = norm(base);
    renderAll();
  }

  // ---------- Library view ----------
  function visible() {
    let a = db.songs;
    if (view.mode === 'fav') a = a.filter(s => db.favs.includes(s.id));
    if (view.mode === 'list') { const l = db.lists.find(x => x.id === view.list); a = l ? l.ids.map(byId).filter(Boolean) : []; }
    if (view.cat) a = a.filter(s => s.cat === view.cat);
    if (view.q) { const q = view.q.toLowerCase(); a = a.filter(s => (s.title + ' ' + s.artist).toLowerCase().includes(q)); }
    return a;
  }
  function renderChips() {
    let h = '';
    if (view.mode === 'list') {
      h = db.lists.map(l => '<button class="pill' + (view.list === l.id ? ' on' : '') + '" data-list="' + l.id + '">' + esc(l.name) + ' (' + l.ids.length + ')</button>').join('');
      if (!db.lists.length) h = '<span class="count">No playlists yet</span>';

    lrc = cur ? parseLrc(cur.lrc) : []; lrcIdx = -2; page = -1; pages = [];
    $('mt').textContent = cur ? cur.title : 'Pick a song'; $('ma').textContent = cur ? (cur.artist || 'Now playing') : 'Tap any song below';
    if (cur) { const h = hash(cur.title + cur.artist); $('vinyl').style.setProperty('--h1', h % 360); $('vinyl').style.setProperty('--h2', (h % 360 + 50 + (h >> 8) % 90) % 360); }
    lcdSet([cur ? cur.title : "DARYA'S MUSIC", cur ? (cur.artist || 'NOW PLAYING') : 'PICK A SONG'], {});
  }
  function lyricTick() {
    if (!lrc.length || !cur || A.paused && !A.currentTime) return;
    const t = A.currentTime; let i = -1; for (let k = 0; k < lrc.length && lrc[k].t <= t; k++) i = k;
    if (i !== lrcIdx) {
      lrcIdx = i; page = -1;
      if (i < 0) { return; }
      if (!lrc[i].text) { lcdSet(['', ''], {}); pages = []; return; }
      pages = wrapPages(lrc[i].text);
    }
    if (lrcIdx >= 0 && pages.length) {
      const dur = (lrc[lrcIdx + 1] ? lrc[lrcIdx + 1].t : lrc[lrcIdx].t + 6) - lrc[lrcIdx].t, p = Math.min(pages.length - 1, Math.floor((t - lrc[lrcIdx].t) / (dur / pages.length)));
      if (p !== page) { page = p; lcdSet(pages[p], { noScroll: true }); }
    }
  }

  // ---------- LED light show ----------
  const LEDC = ['#8b5cf6', '#7c6cff', '#6d84ff', '#5fa0ff', '#a3bcff', '#f5d58a', '#ffd36b', '#fff6c9'];
  const cvL = $('leds'), g = cvL.getContext('2d'), LC = 32, LR = 8, lv = new Array(LC).fill(0), pk = new Array(LC).fill(0); let clock = 0;
  function levels(dt) {
    const target = new Array(LC).fill(0), playing = cur && !A.paused;
    if (playing && an) {
      an.getByteFrequencyData(fd); let sum = 0;
      for (let i = 0; i < LC; i++) { const idx = Math.floor(Math.pow(i / LC, 1.6) * 60) + 1; target[i] = clamp((fd[idx] + fd[idx + 1] + fd[idx + 2]) / 3 / 255 * 1.3); sum += target[i]; }
      silent = sum < 0.01 ? silent + dt : 0;                   // if the browser gives no data (blocked source), fall back to a gentle animation
    }
    if (playing && (!an || silent > 1.5)) { const beat = 0.55 + 0.45 * Math.pow(Math.abs(Math.sin(clock * 2.2)), 3); for (let i = 0; i < LC; i++) target[i] = clamp((0.25 + 0.55 * Math.abs(Math.sin(clock * (1.4 + i * 0.09) + i * 0.7))) * beat * (1 - i / LC * 0.5)); }
    for (let i = 0; i < LC; i++) { lv[i] += (target[i] - lv[i]) * (target[i] > lv[i] ? 0.55 : 0.13); pk[i] = Math.max(pk[i] - dt * 0.7, lv[i]); }
  }
  function drawLeds() {
    const w = cvL.width, h = cvL.height; g.clearRect(0, 0, w, h); const cw = w / LC, rh = h / LR, rad = Math.min(cw, rh) * 0.28;
    for (let c = 0; c < LC; c++) {
      const n = Math.round(lv[c] * LR), pr = Math.min(LR - 1, Math.round(pk[c] * LR));
      for (let r = 0; r < LR; r++) {
        const x = (c + 0.5) * cw, y = h - (r + 0.5) * rh, lit = r < n;
        g.shadowBlur = lit ? 10 : 0; g.shadowColor = LEDC[r];
        g.fillStyle = lit ? LEDC[r] : 'rgba(170,140,255,.13)';
        if (!lit && r === pr && pk[c] > 0.06) { g.fillStyle = 'rgba(255,122,168,.95)'; g.shadowColor = 'rgba(255,122,168,.9)'; g.shadowBlur = 8; }
        g.beginPath(); g.arc(x, y, rad, 0, 6.283); g.fill();
      }
    }
    g.shadowBlur = 0;
    let bass = 0; for (let i = 0; i < 4; i++) bass += lv[i]; document.documentElement.style.setProperty('--g', (0.22 + bass / 4 * 0.6).toFixed(2));
  }
  let lastT = performance.now();
  function frame(now) { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; clock += dt; lcdTick(dt); lyricTick(); levels(dt); drawLeds(); requestAnimationFrame(frame); }

  // ---------- Wiring ----------
  $('list').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'), li = e.target.closest('.song'); if (!b || !li) return; const id = li.dataset.id;
    if (b.dataset.act === 'play') playFromList(id);
    else if (b.dataset.act === 'fav' && admin) { db.favs = db.favs.includes(id) ? db.favs.filter(x => x !== id) : db.favs.concat(id); saveDraft(); }
    else if (b.dataset.act === 'more' && admin) moreDlg(id);
  });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b) return; view.mode = b.dataset.mode; view.cat = ''; if (view.mode === 'list' && !db.lists.some(l => l.id === view.list)) view.list = db.lists[0] ? db.lists[0].id : ''; renderAll(); });
  $('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.list !== undefined) view.list = b.dataset.list; else view.cat = b.dataset.cat; renderAll(); });
  $('playAll').addEventListener('click', () => { const a = visible(); if (a.length) playFromList(a[0].id); });
  $('q').addEventListener('input', () => { view.q = $('q').value.trim(); renderList(); });
  $('adminBtn').addEventListener('click', () => { if (admin) { document.getElementById('adminBar').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } else loginDlg(); });
  $('aAdd').addEventListener('click', addSongsDlg); $('aCats').addEventListener('click', catsDlg); $('aLists').addEventListener('click', listsDlg); $('aExport').addEventListener('click', exportDlg);
  $('aImport').addEventListener('click', importDlg);
  $('importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { db = norm(JSON.parse(r.result)); saveDraft(); } catch (err) { open('<h2>Import</h2><p>That file could not be read.</p><div class="row2">' + closeBtn + '</div>', wireClose); } };
    r.readAsText(f); e.target.value = '';
  });
  $('aOut').addEventListener('click', () => { admin = false; sessionStorage.removeItem('dm-admin'); renderAll(); });
  $('aNote').addEventListener('click', () => {});

  sizeLcd(); lcdSet(["DARYA'S MUSIC", 'PICK A SONG'], {}); load(); requestAnimationFrame(frame);
})();
</script>
</body>
