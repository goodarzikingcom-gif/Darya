<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Vault 🔒✨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    user-select: none;
}

body {
    background: #080711;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

.bg-glow {
    position: absolute;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(255, 64, 129, 0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    filter: blur(40px);
}

.secret-card {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 480px;
    padding: 40px 30px;
    background: rgba(18, 16, 32, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    text-align: center;
}

.pass-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.lock-icon {
    font-size: 2.8rem;
    filter: drop-shadow(0 0 10px rgba(255, 64, 129, 0.5));
}

.pass-title {
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
}

.pass-input {
    width: 100%;
    max-width: 280px;
    padding: 12px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 1rem;
    text-align: center;
    outline: none;
}

.pass-input:focus {
    border-color: #ff4081;
    box-shadow: 0 0 15px rgba(255, 64, 129, 0.4);
}

.unlock-btn {
    background: linear-gradient(135deg, #ff4081, #7c4dff);
    color: #fff;
    border: none;
    padding: 10px 32px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
}

.error-msg {
    color: #ff5252;
    font-size: 0.85rem;
    display: none;
}

.secret-content {
    display: none;
}

.stat-number {
    font-size: 2.3rem;
    font-weight: 700;
    background: linear-gradient(45deg, #ff80ab, #ffffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
}

.stat-label {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.divider {
    height: 1px;
    width: 60px;
    background: rgba(255, 64, 129, 0.4);
    margin: 20px auto;
}

.main-quote {
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.6;
    color: #ffffff;
}

.highlight-darya {
    color: #ff4081;
    text-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
}

.sub-quote {
    margin-top: 15px;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 300;
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="secret-card">
    
    <!-- ورودی رمز -->
    <div class="pass-box" id="passBox">
        <div class="lock-icon">🔒</div>
        <div class="pass-title">Restricted Access</div>
        <input type="text" id="passInput" class="pass-input" placeholder="Enter password..." autocomplete="off">
        <button class="unlock-btn" onclick="checkPassword()">Unlock</button>
        <div class="error-msg" id="errorMsg">Wrong password, try again! 😉</div>
    </div>

    <!-- محتوای مخفی -->
    <div class="secret-content" id="secretContent">
        <div class="stat-number">8,000,000,000+</div>
        <div class="stat-label">People On Earth</div>

        <div class="divider"></div>

        <div class="main-quote">
            Out of 8 billion people in the world...<br>
            I choose <span class="highlight-darya">You</span>.
        </div>
        <div class="sub-quote">
            Every second. Every minute. Every single day, Darya. ❤️✨
        </div>
    </div>

</div>

<script>
function checkPassword() {
    // گرفتن متن ورودی و حذف فاصله‌های اضافی
    const input = document.getElementById('passInput').value.trim().toLowerCase();
    
    // طوری تنظیم شده که هم "just friend" و هم "justfriend" یا "just freind" رو قبول کنه تا اذیت نکنه!
    if (input === "just friend" || input === "justfriend" || input === "just freind" || input === "justfreind") {
        document.getElementById('passBox').style.display = 'none';
        document.getElementById('secretContent').style.display = 'block';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}

// دکمه Enter کیبورد
document.getElementById('passInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        checkPassword();
    }
});
</script>

</body>
</html>
