<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanning Memories... 🧠✨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Fira Code', monospace;
    user-select: none;
}

body {
    background: #060711;
    color: #ff80ab;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* افکت شبکه هوش مصنوعی و ستاره‌های ریز پس‌زمینه */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 64, 129, 0.08) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: moveGrid 40s linear infinite;
    z-index: 1;
}

@keyframes moveGrid {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-50px, -50px); }
}

/* کارت اصلی اسکن */
.scan-card {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 480px;
    background: rgba(15, 17, 32, 0.85);
    border: 1px solid rgba(255, 64, 129, 0.3);
    border-radius: 20px;
    padding: 35px 30px;
    box-shadow: 0 0 40px rgba(255, 64, 129, 0.15), inset 0 0 15px rgba(255, 64, 129, 0.05);
    backdrop-filter: blur(12px);
}

/* تیتر هدر */
.header {
    text-align: center;
    font-size: 1.2rem;
    color: #ffffff;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.pulse-dot {
    width: 10px;
    height: 10px;
    background: #ff4081;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff4081;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
}

/* بخش نمایش خطوط اسکن */
.scan-progress {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 30px;
    font-size: 1.1rem;
    letter-spacing: 3px;
    color: #ff80ab;
}

.progress-line {
    opacity: 0;
    transform: translateX(-10px);
    transition: all 0.4s ease;
    text-shadow: 0 0 8px rgba(255, 128, 171, 0.6);
}

.progress-line.visible {
    opacity: 1;
    transform: translateX(0);
}

/* کارت نتایج اسکن */
.result-box {
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border-top: 1px dashed rgba(255, 255, 255, 0.2);
    padding-top: 25px;
    margin-top: 10px;
}

.result-box.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.found-title {
    color: #00ffcc;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 18px;
    text-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
}

.data-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 1rem;
}

.label {
    color: rgba(255, 255, 255, 0.6);
}

.value {
    color: #ffffff;
    font-weight: 600;
}

.value.highlight {
    color: #ff4081;
    text-shadow: 0 0 10px rgba(255, 64, 129, 0.8);
}

/* خط اسکنر درخشان بر روی کارت */
.scanner-bar {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff4081, transparent);
    box-shadow: 0 0 15px #ff4081;
    animation: scanAnimation 2.5s infinite ease-in-out;
    border-radius: 20px;
}

@keyframes scanAnimation {
    0% { top: 0%; opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
}
</style>
</head>

<body>

<div class="scan-card">
    <div class="scanner-bar"></div>

    <div class="header">
        <div class="pulse-dot"></div>
        Scanning Memories...
    </div>
    <!-- اسکرول انیمیشنی خطوط اسکن -->
    <div class="scan-progress">
        <div class="progress-line" id="line1">█░░░░░░░</div>
        <div class="progress-line" id="line2">████░░░░</div>
        <div class="progress-line" id="line3">███████</div>
    </div>

    <!-- باکس اطلاعات دریا -->
    <div class="result-box" id="resultBox">
        <div class="found-title">
            Favorite Person Found ✔
        </div>

        <div class="data-row">
            <span class="label">Name:</span>
            <span class="value highlight">Darya ❤️</span>
        </div>

        <div class="data-row">
            <span class="label">Status:</span>
            <span class="value">Irreplaceable ✨</span>
        </div>

        <div class="data-row">
            <span class="label">Priority:</span>
            <span class="value">#1 In My Heart</span>
        </div>
    </div>
</div>

<script>
const line1 = document.getElementById('line1');
const line2 = document.getElementById('line2');
const line3 = document.getElementById('line3');
const resultBox = document.getElementById('resultBox');

// فرآیند پدیدار شدن لایه‌ها بر اساس زمان‌بندی دقیق
setTimeout(() => line1.classList.add('visible'), 500);
setTimeout(() => line2.classList.add('visible'), 1200);
setTimeout(() => line3.classList.add('visible'), 1900);

// نمایش نتیجه نهایی پس از اتمام اسکن
setTimeout(() => {
    resultBox.classList.add('show');
}, 2600);
</script>

</body>
</html>
