<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صفحه PHP - دریا</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .editor {
            background: #252526;
            border: 1px solid #333;
            border-radius: 8px;
            width: 520px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .editor-header {
            background: #333333;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .editor-title {
            margin-right: 10px;
            font-size: 14px;
            color: #bbb;
        }
        .code-wrapper {
            padding: 20px;
        }
        /* افکت تایپ استاندارد بدون خطا */
        .typewriter {
            font-size: 18px;
            color: #569cd6;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #aeafad;
            width: 29ch; /* تنظیم دقیق بر اساس تعداد کاراکترهای زیر */
            animation: typing 3s steps(29, end) forwards, blink 0.75s step-end infinite;
            margin: 0;
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 29ch; }
        }
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #aeafad; }
        }
        .output-box {
            margin-top: 25px;
            background: #181818;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px 25px;
            width: 470px;
            text-align: center;
            font-size: 20px;
            color: #4ec9b0;
            opacity: 0;
            animation: showOutput 0.8s ease-in-out forwards;
            animation-delay: 3.2s;
        }
        @keyframes showOutput {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="editor">
        <div class="editor-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="editor-title">darya.php</span>
        </div>
        <div class="code-wrapper">
            <!-- استفاده از تگ استاندارد و ایمن PHP -->
            <pre class="typewriter">&lt;?php echo "I love Darya"; ?&gt;</pre>
        </div>
    </div>

    <div class="output-box">
        خروجی سرور: I love Darya ❤️
    </div>

</body>
</html>
