<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --blush: #ffe4ee; --petal: #ffb3cf; --rose: #e8578f; --plum: #7a2a55; --cream: #fff8fb; --ink: var(--plum); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 70px 18px 32px; text-align: center;
    background: radial-gradient(circle at 20% 10%, #fff 0, var(--blush) 45%, var(--petal) 100%);
    font-family: 'Fredoka', system-ui, sans-serif; color: var(--ink);
    transition: background .8s ease, color .8s ease;
  }
  /* Matrix theme: dark page with green accents */
  body.matrix { background: radial-gradient(circle at 50% 30%, #0b1a12 0, #040806 70%); --ink: #8dffc0; }
  h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(2.4rem, 6vw, 4rem); margin: 0; color: var(--rose); transition: color .8s; }
  body.matrix h1 { color: #3dff9a; font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; }

  .tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tab {
    font: inherit; font-weight: 600; cursor: pointer; color: var(--plum); background: var(--cream);
    border: 3px solid var(--petal); border-radius: 999px; padding: 6px 20px;
  }
  .tab[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: #fff; }
  body.matrix .tab { background: #07110c; border-color: #1f7a4d; color: #8dffc0; }
  body.matrix .tab[aria-pressed="true"] { background: #1f7a4d; border-color: #3dff9a; color: #04110a; }
  .tab:focus-visible, .back:focus-visible, .line:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }

  .stage {
    position: relative; width: min(94vw, 1000px); aspect-ratio: 1464 / 520; overflow: hidden;
    border: 6px solid var(--cream); border-radius: 28px; background: #000;
    box-shadow: 0 10px 40px rgba(232, 87, 143, .4), 0 0 60px rgba(255, 179, 207, .5);
    transition: box-shadow .8s, border-color .8s;
  }
  body.matrix .stage { border-color: #1f7a4d; box-shadow: 0 0 50px rgba(61, 255, 154, .35); }
  .stage img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 1s ease; animation: drift 18s ease-in-out infinite alternate;
  }
  .stage img.on { opacity: 1; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease; }
  .stage canvas.on { opacity: 1; }
  .replay {
    position: absolute; right: 14px; bottom: 14px; z-index: 2; font: inherit; font-weight: 600; cursor: pointer;
    color: #eafff3; background: rgba(31, 122, 77, .85); border: 2px solid #3dff9a; border-radius: 999px; padding: 4px 16px;
  }
  .replay[hidden] { display: none; }
  /* Faint scanlines on the matrix image */
  .stage.scan::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }

  .line {
    min-height: 4.2em; max-width: 34ch; font-size: clamp(1.2rem, 2.8vw, 1.7rem); line-height: 1.4;
    background: none; border: 0; color: inherit; font-family: inherit; cursor: pointer;
    transition: opacity .6s ease;
  }
  .line.out { opacity: 0; }
  .hint { margin: -8px 0 0; font-size: .9rem; opacity: .7; }

  /* Voice message button */
  .voice { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .listen {
    display: inline-flex; align-items: center; gap: 12px; font: inherit; font-weight: 600; font-size: 1.1rem;
    color: #fff; background: var(--rose); border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer;
    box-shadow: 0 6px 22px rgba(232, 87, 143, .45); transition: transform .15s ease, background .8s;
  }
  .listen:hover { transform: scale(1.04); }
  .listen:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
  body.matrix .listen { background: #1f7a4d; color: #eafff3; box-shadow: 0 0 24px rgba(61, 255, 154, .4); }
  .bars { display: inline-flex; align-items: center; gap: 3px; height: 18px; }
  .bars i { width: 3px; height: 6px; border-radius: 2px; background: currentColor; opacity: .7; }
  .voice.playing .bars i { animation: eq .9s ease-in-out infinite; }
  .voice.playing .bars i:nth-child(2) { animation-delay: .15s; }
  .voice.playing .bars i:nth-child(3) { animation-delay: .3s; }
  .voice.playing .bars i:nth-child(4) { animation-delay: .45s; }
  .voice.playing .bars i:nth-child(5) { animation-delay: .6s; }
  @keyframes eq { 0%, 100% { height: 5px; } 50% { height: 18px; } }
  .progress { width: min(260px, 70vw); height: 4px; border-radius: 2px; background: rgba(122, 42, 85, .2); overflow: hidden; }
  body.matrix .progress { background: rgba(61, 255, 154, .2); }
  .progress b { display: block; height: 100%; width: 0; background: var(--rose); }
  body.matrix .progress b { background: #3dff9a; }
  .voice-note { font-size: .9rem; min-height: 1.2em; opacity: .8; margin: 0; }
  /* The picture glows softly while the voice plays */
  body.talking .stage { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 10px 60px rgba(232, 87, 143, .8), 0 0 90px rgba(255, 179, 207, .9); } }
  body.talking.matrix .stage { animation-name: glowg; }
  @keyframes glowg { 50% { box-shadow: 0 0 90px rgba(61, 255, 154, .7); } }

  .back { position: fixed; top: 14px; left: 16px; z-index: 5; text-decoration: none; font-weight: 600; color: var(--plum);
    background: var(--cream); border: 3px solid var(--petal); border-radius: 999px; padding: 6px 16px; }
  @media (prefers-reduced-motion: reduce) { .stage img { animation: none; } * { transition-duration: .01s !important; } }
</style>
</head>
<body>
  
  <h1>Eyes</h1>

  <div class="tabs" role="group" aria-label="Choose a version">
    <button class="tab" data-v="0" aria-pressed="true">Your eyes</button>
    <button class="tab" data-v="1" aria-pressed="false">Reflection</button>
    <button class="tab" data-v="2" aria-pressed="false">Matrix</button>
    <button class="tab" data-v="3" aria-pressed="false">Animation</button>
  </div>

  <div class="stage" id="stage">
    <img src="eyes-photo.jpg" alt="Darya's eyes" class="on">
    <img src="eyes-reflection.jpg" alt="Darya's eyes with Amin reflected in them">
    <img src="eyes-matrix.png" alt="Darya's eyes drawn as code, with Amin inside them">
    <canvas id="anim" width="1464" height="520" aria-label="Animation: her eyes appear, then a heart travels from Amin into them"></canvas>
    <button class="replay" id="replay" hidden>↻ Replay</button>
  </div>

  <button class="line" id="line" aria-live="polite"></button>
  <p class="hint">Tap the words for the next one</p>

  <!-- Put your recording next to this page as voice.mp3 (or voice.m4a / voice.ogg) -->
  <div class="voice" id="voice">
    <button class="listen" id="listen" aria-label="Play voice message">
      <span id="icon">▶</span>
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span id="lbl">Listen to me</span>
    </button>
    <div class="progress" aria-hidden="true"><b id="bar"></b></div>
    <p class="voice-note" id="note"></p>
    <audio id="voiceAudio" preload="auto">
      <source src="voice.mp3" type="audio/mpeg">
      <source src="voice.m4a" type="audio/mp4">
      <source src="voice.ogg" type="audio/ogg">
    </audio>
  </div>

<script>
(() => {
  // One set of sentences per version
  const versions = [
    ['My whole world is inside your eyes.',
     'When I look into your eyes, I forget everything, and I smile without even knowing it.',
     'In your eyes, I found a home I never knew I was looking for.'],
    ['Look closely. That is me, smiling inside your eyes.',
     'I could get lost in them forever, and I would never want to be found.',
     'Every time I look at them, I fall in love a little more.'],
    ['Even in a world made of code, all I see is you.',
     'No matter how many lines I write, they all lead back to your eyes.',
     'When I look into your eyes, I forget everything, and I smile without even knowing it.']
  ];
  const tabs = [...document.querySelectorAll('.tab')];
  const imgs = [...document.querySelectorAll('#stage img')];
  const stage = document.getElementById('stage');
  const line = document.getElementById('line');
  let v = 0, i = 0, timer;

  function show() {
    line.classList.add('out');
    setTimeout(() => {
      line.textContent = '“' + versions[v][i].replace(/’/g, "'") + '”';
      line.classList.remove('out');
    }, 450);
  }
  function next() { if (v === 3) return; i = (i + 1) % versions[v].length; show(); restart(); }
  let talking = false;
  function restart() { clearInterval(timer); timer = setInterval(() => { if (!talking) next(); }, 7000); }

  function pick(n) {
    v = n; i = 0;
    imgs.forEach((im, k) => im.classList.toggle('on', k === n));
    cvA.classList.toggle('on', n === 3);
    tabs.forEach((t, k) => t.setAttribute('aria-pressed', k === n));
    document.body.classList.toggle('matrix', n >= 2);
    stage.classList.toggle('scan', n === 2);
    if (n === 3) { clearInterval(timer); line.textContent = ''; startAnim(); }
    else { stopAnim(); show(); restart(); }
  }
  tabs.forEach((t, k) => t.addEventListener('click', () => pick(k)));
  line.addEventListener('click', next);
  // ---------- Animation tab: her eyes appear, then a heart travels from Amin into them ----------
  const cvA = document.getElementById('anim');
  const g = cvA.getContext('2d');
  const AW = cvA.width, AH = cvA.height;
  const replayBtn = document.getElementById('replay');
  const asciiImg = new Image(); asciiImg.src = 'eyes-ascii.jpg';
  const aminImg = new Image(); aminImg.src = 'amin.jpg';          // optional: small photo on the heart's starting point
  const matrixImg = imgs[2];
  const IRIS_L = { x: 362, y: 335 }, IRIS_R = { x: 1085, y: 350 };   // iris centers in canvas pixels
  const stars = Array.from({ length: 90 }, (_, k) => ({ x: Math.random() * AW, y: Math.random() * AH, r: 0.8 + Math.random() * 1.6, p: Math.random() * 6.28, sp: 0.8 + Math.random() * 2, cross: k < 14 }));
  const HEART_CHARS = 'Z0Q8O@#%&';
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = k => k * k * (3 - 2 * k);
  let raf = 0, t0 = 0, lineStep = -1, done = false, burst = false, parts = [];

  function setLine(txt) {
    line.classList.add('out');
    setTimeout(() => { if (v === 3) { line.textContent = txt; line.classList.remove('out'); } }, 450);
  }

  // A heart built from text characters that flicker, with a pink glow
  function drawHeart(x, y, size, t, alpha) {
    const cols = 17, rows = 15, cw = size / cols, chh = size / rows;
    g.font = (chh * 1.25) + 'px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(255, 90, 150, .9)'; g.shadowBlur = 14;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const u = ((i + .5) / cols) * 3 - 1.5, w = 1.35 - ((j + .5) / rows) * 2.9;
      const f = Math.pow(u * u + w * w - 1, 3) - u * u * w * w * w;
      if (f > 0) continue;
      const k = clamp(-f * 3);
      const ch = HEART_CHARS[(i * 31 + j * 17 + Math.floor(t * 5)) % HEART_CHARS.length];
      g.fillStyle = 'rgba(255, ' + Math.round(90 + 110 * (1 - k)) + ', ' + Math.round(140 + 80 * (1 - k)) + ', ' + alpha + ')';
      g.fillText(ch, x - size / 2 + (i + .5) * cw, y - size / 2 + (j + .5) * chh);
    }
    g.shadowBlur = 0;
  }

  function frame(now) {
    const t = (now - t0) / 1000;
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.fillStyle = '#02060a'; g.fillRect(0, 0, AW, AH);

    // 1) Twinkling stars
    const sa = clamp(t / 1.5);
    stars.forEach(s => {
      const a = sa * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.p)));
      g.fillStyle = 'rgba(235, 245, 255, ' + a + ')'; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.28); g.fill();
      if (s.cross) {
        const L = 8 + 10 * a; g.strokeStyle = 'rgba(235, 245, 255, ' + a * 0.8 + ')'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(s.x - L, s.y); g.lineTo(s.x + L, s.y); g.moveTo(s.x, s.y - L); g.lineTo(s.x, s.y + L); g.stroke();
      }
    });

    // 2) Her eyes fade in as code, later swap to the version with Amin inside
    g.globalCompositeOperation = 'lighter';
    const ea = ease(clamp((t - 2) / 3)), ma = ease(clamp((t - 12.4) / 1.8));
    if (asciiImg.complete && asciiImg.naturalWidth) { g.globalAlpha = ea * (1 - ma); g.drawImage(asciiImg, 0, 0, AW, AH); }
    if (matrixImg.complete && matrixImg.naturalWidth) { g.globalAlpha = ma; g.drawImage(matrixImg, 0, 0, AW, AH); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

    // 3) Amin's heart flies in along a curve from the bottom-left
    const P0 = { x: 150, y: 420 }, C = { x: 330, y: 90 }, P2 = { x: 723, y: 290 };
    if (t >= 5.2 && t < 8.2) {                                            // Amin's tag
      const a = clamp((t - 5.2) / 0.6) * (1 - clamp((t - 7.4) / 0.8));
      g.globalAlpha = a; g.save(); g.beginPath(); g.arc(70, 465, 30, 0, 6.28); g.clip();
      if (aminImg.complete && aminImg.naturalWidth) { const m = Math.min(aminImg.naturalWidth, aminImg.naturalHeight); g.drawImage(aminImg, (aminImg.naturalWidth - m) / 2, (aminImg.naturalHeight - m) / 2, m, m, 40, 435, 60, 60); }
      else { g.fillStyle = '#ffb3cf'; g.fillRect(40, 435, 60, 60); }
      g.restore(); g.strokeStyle = '#ff7aa8'; g.lineWidth = 3; g.beginPath(); g.arc(70, 465, 30, 0, 6.28); g.stroke();
      g.fillStyle = '#ffd6e5'; g.font = '600 16px sans-serif'; g.textAlign = 'center'; g.fillText('Amin', 70, 510); g.globalAlpha = 1;
    }
    if (t >= 5.4 && t < 10.6) {
      const u = ease(clamp((t - 7) / 3.6)), m = 1 - u;
      const x = m * m * P0.x + 2 * m * u * C.x + u * u * P2.x, y = m * m * P0.y + 2 * m * u * C.y + u * u * P2.y;
      const beat = 1 + 0.07 * Math.pow(Math.max(0, Math.sin(t * 7)), 3);
      drawHeart(x, y, (130 - 25 * u) * beat * clamp((t - 5.4) / 0.8), t, 1);
    }
    // The heart splits in two and each half goes into an iris
    if (t >= 10.6 && t < 12.4) {
      const u = ease(clamp((t - 10.6) / 1.2)), fade = 1 - clamp((t - 11.6) / 0.8);
      [IRIS_L, IRIS_R].forEach(T => drawHeart(P2.x + (T.x - P2.x) * u, P2.y + (T.y - P2.y) * u, 70 * (1 - 0.35 * u), t, fade));
    }
    if (t >= 11.8 && !burst) {                                            // flash and little hearts
      burst = true;
      [IRIS_L, IRIS_R].forEach(T => { for (let k = 0; k < 16; k++) { const a = Math.random() * 6.28, sp = 1 + Math.random() * 3; parts.push({ x: T.x, y: T.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1 }); } });
    }
    if (t >= 11.8 && t < 12.8) {
      const k = clamp((t - 11.8) / 0.8);
      [IRIS_L, IRIS_R].forEach(T => {
        const gr = g.createRadialGradient(T.x, T.y, 0, T.x, T.y, 40 + 160 * k);
        gr.addColorStop(0, 'rgba(255, 220, 235, ' + 0.9 * (1 - k) + ')'); gr.addColorStop(1, 'rgba(255, 120, 170, 0)');
        g.fillStyle = gr; g.fillRect(T.x - 220, T.y - 220, 440, 440);
      });
    }
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life -= 0.012; });
    parts = parts.filter(p => p.life > 0);
    g.font = '20px serif'; g.textAlign = 'center';
    parts.forEach(p => { g.globalAlpha = clamp(p.life); g.fillStyle = '#ff7aa8'; g.fillText('♥', p.x, p.y); });
    g.globalAlpha = 1;

    // Captions follow the story
    [[2, 'First, your eyes.'], [6, 'Then my heart finds its way to them.'], [12.4, 'And now my whole world is inside your eyes.']]
      .forEach(([ts, txt], k) => { if (t >= ts && lineStep < k) { lineStep = k; setLine(txt); } });
    if (t >= 15 && !done) { done = true; replayBtn.hidden = false; }
  }

  function loop(now) { frame(now); raf = requestAnimationFrame(loop); }
  function startAnim() {
    cancelAnimationFrame(raf);
    t0 = performance.now(); lineStep = -1; done = false; burst = false; parts = []; replayBtn.hidden = true;
    raf = requestAnimationFrame(loop);
  }
  function stopAnim() { cancelAnimationFrame(raf); replayBtn.hidden = true; }
  replayBtn.addEventListener('click', startAnim);

  pick(0);

  // Voice message player
  const audio = document.getElementById('voiceAudio');
  const voice = document.getElementById('voice');
  const btn = document.getElementById('listen');
  const icon = document.getElementById('icon');
  const lbl = document.getElementById('lbl');
  const bar = document.getElementById('bar');
  const note = document.getElementById('note');

  function setPlaying(on, label) {
    talking = on;
    voice.classList.toggle('playing', on);
    document.body.classList.toggle('talking', on);
    icon.textContent = on ? '❚❚' : '▶';
    lbl.textContent = label || (on ? 'Pause' : 'Listen to me');
  }
  btn.addEventListener('click', () => {
    note.textContent = '';
    if (!audio.paused) { audio.pause(); return; }
    audio.play().catch(() => { note.textContent = 'My voice message is on its way 💗'; });
  });
  audio.addEventListener('play', () => setPlaying(true));
  audio.addEventListener('pause', () => { if (!audio.ended) setPlaying(false); });
  audio.addEventListener('ended', () => { setPlaying(false, 'Listen again'); bar.style.width = '0'; });
  audio.addEventListener('timeupdate', () => { if (audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%'; });
})();
</script>
</body>
</html>
