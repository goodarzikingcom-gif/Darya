<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Ending Not Found ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    user-select: none;
}

body {
    background: #0f0c20;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    color: #fff;
}

/* پس‌زمینه با هاله درخشان بنفش/صورتی */
.glow-bg {
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(233, 30, 99, 0.25) 0%, rgba(0,0,0,0) 70%);
    border-radius: 50%;
    animation: pulse 4s infinite alternate ease-in-out;
}

@keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(1.3); opacity: 1; }
}

.error-container {
    text-align: center;
    padding: 40px 25px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    border-radius: 28px;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(233, 30, 99, 0.1);
    z-index: 10;
}

.error-code {
    font-size: 85px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(45deg, #ff4081, #ff80ab, #ffffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255, 64, 129, 0.3);
}

.heart-icon {
    font-size: 45px;
    margin: 15px 0;
    display: inline-block;
    animation: beat 1.2s infinite ease-in-out;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

.error-title {
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 12px;
}

.error-message {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.6;
    margin-bottom: 30px;
    font-weight: 300;
}

.home-btn {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(45deg, #e91e63, #ff4081);
    color: #fff;
    padding: 12px 32px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    transition: all 0.3s ease;
}

.home-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(233, 30, 99, 0.6);
}
</style>
</head>

<body>

<div class="glow-bg"></div>

<div class="error-container">
    <div class="error-code">404</div>
    <div class="heart-icon">❤️</div>
    <div class="error-title">Ending Not Found</div>
    <p class="error-message">
        Our story has no ending. ❤️<br>
        Because my love for you is infinite, Darya.
    </p>
    <a href="reasons.html" class="home-btn">Back to Our Story ✨</a>
</div>

</body>
</html>
